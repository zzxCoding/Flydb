# 发布流程：tag（v*）触发，或手动指定既有 tag。
# 一次构建同时完成：全量 verify → GPG 签名 → 发布 Maven Central（Central Portal）
# → 生成校验和 → 创建 GitHub Release 附 CLI ZIP。
# 所需 Secrets：CENTRAL_PORTAL_USERNAME / CENTRAL_PORTAL_PASSWORD（user token）、
# GPG_PRIVATE_KEY（armored 私钥）、GPG_PASSPHRASE。
name: Flydb Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.1，必须已存在）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flydb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # settings.xml 中 ${env.*} 由 Maven 在 deploy 阶段解析，凭据必须在整个 job 可见
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Assert tag matches pom revision
        run: |
          tag_version="${RELEASE_TAG#v}"
          pom_version="$(./mvnw -B help:evaluate -Dexpression=revision -q -DforceStdout)"
          if [ "$tag_version" != "$pom_version" ]; then
            echo "tag $RELEASE_TAG 与 pom revision $pom_version 不一致，中止发布" >&2
            exit 1
          fi
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Write Maven settings with publishing credentials
        # 凭据经 ${env.*} 间接引用（job 级 env），不落入 settings.xml 明文；单引号防止 shell 展开
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">' \
            '    <servers>' \
            '        <server>' \
            '            <id>central</id>' \
            '            <username>${env.CENTRAL_PORTAL_USERNAME}</username>' \
            '            <password>${env.CENTRAL_PORTAL_PASSWORD}</password>' \
            '        </server>' \
            '        <server>' \
            '            <id>gpg.passphrase</id>' \
            '            <passphrase>${env.GPG_PASSPHRASE}</passphrase>' \
            '        </server>' \
            '    </servers>' \
            '</settings>' > "$HOME/.m2/settings.xml"
      # deploy 生命周期覆盖 verify：测试、覆盖率门禁、签名（verify 阶段）、
      # 发布（-Pcentral）单次完成；waitUntil=published 使 Central 上线后才算成功。
      - name: Build, sign and publish to Maven Central
        run: ./mvnw -B -Pcentral deploy
      - name: Assert Java 8 bytecode boundary
        run: >-
          ./scripts/check-bytecode.sh 52
          flydb-core/target/classes
          flydb-cli/target/classes
          flydb-spring-boot-2-starter/target/classes
          examples/boot2-demo/target/classes
      - name: Assert Java 17 bytecode boundary
        run: >-
          ./scripts/check-bytecode.sh 61
          flydb-spring-boot-3-starter/target/classes
          examples/boot3-demo/target/classes
      - name: Check signed release artifacts
        run: |
          staging="$(mktemp -d)/flydb-staging"
          mkdir -p "$staging"
          # 只收集当前版本的产物，避免 target 中的陈旧文件干扰签名门禁
          for module in flydb-core flydb-cli flydb-spring-boot-2-starter flydb-spring-boot-3-starter; do
            cp "$module"/target/*-"${RELEASE_TAG#v}"*.jar "$module"/target/*-"${RELEASE_TAG#v}"*.zip \
               "$module"/target/*-"${RELEASE_TAG#v}"*.asc "$staging"/ 2>/dev/null || true
          done
          ./scripts/check-release-artifacts.sh --signatures "$staging" flydb-cli/target
      - name: Create GitHub Release with CLI distribution
        run: |
          version="${RELEASE_TAG#v}"
          zip_file="flydb-cli-${version}.zip"
          # 发布正文 = CHANGELOG 对应版本段落 + 标准安装说明，与 v0.2.0 起的正文结构一致
          notes="$(mktemp -d)/release-notes.md"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes"
          printf '\n' >> "$notes"
          printf '%s\n' '## 安装' \
            '' \
            'Maven Central：' \
            '' \
            '```xml' \
            '<dependency>' \
            '  <groupId>io.github.zzxcoding</groupId>' \
            '  <artifactId>flydb-core</artifactId>' \
            "  <version>${version}</version>" \
            '</dependency>' \
            '```' \
            '' \
            'Spring Boot 应用改用 `flydb-spring-boot-2-starter`（Java 8 / Boot 2.7）或 `flydb-spring-boot-3-starter`（Java 17 / Boot 3）。' \
            '' \
            "CLI：下载下方 \`${zip_file}\`，使用同名 \`.sha256\` 文件校验后解压：" \
            '' \
            '```bash' \
            "shasum -a 256 -c ${zip_file}.sha256" \
            "unzip ${zip_file}" \
            "cd flydb-cli-${version}" \
            'bin/flydb version' \
            '```' \
            '' \
            "完整变更与验证边界见 [CHANGELOG.md](https://github.com/zzxCoding/Flydb/blob/${RELEASE_TAG}/CHANGELOG.md)。" >> "$notes"
          cd flydb-cli/target
          shasum -a 256 "$zip_file" > "$zip_file.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$zip_file" "$zip_file.sha256" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --title "Flydb ${version}" \
              --notes-file "$notes" \
              "$zip_file" "$zip_file.sha256"
          fi

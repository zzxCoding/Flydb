name: 功能建议
description: 提议一个有明确使用场景的 Flydb 改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户、环境和当前受阻的工作流，不要只给出实现方案。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 说明成功后的可观察行为和安全边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 主要影响范围
      options:
        - Core API / migration engine
        - CLI
        - Configuration
        - Spring Boot Starter
        - Database dialect / JDBC integration
        - Documentation / Agent Skill
        - Release / installation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 示例或验证方式
      description: 可提供脱敏后的命令、配置、迁移结构或验收标准。

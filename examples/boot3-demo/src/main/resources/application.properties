server.port=${SERVER_PORT:18083}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/flydb_demo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.hikari.maximum-pool-size=2

flydb.database-type=mysql
flydb.locations=classpath:db/migration
flydb.table=flydb_boot3_history

# 可选：设置以下环境变量时，迁移使用独立高权限账号；不设置则复用应用 DataSource。
flydb.url=${FLYDB_URL:}
flydb.user=${FLYDB_USER:}
flydb.password=${FLYDB_PASSWORD:}
